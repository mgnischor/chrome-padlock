name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # Weekly, so a newly published advisory shows up even when nobody pushes.
        - cron: "0 6 * * 1"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Typecheck, test and build (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run check

    package:
        name: Package the Chrome Web Store zip
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # Builds with minification and verifies the result: no network code, no dev files, every
            # file the manifest points to is present.
            - run: npm run package
            - uses: actions/upload-artifact@v7
              with:
                  name: padlock-package
                  path: release/*.zip
                  if-no-files-found: error

    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=high
